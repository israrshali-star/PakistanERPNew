<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1905 889" role="img" aria-label="Meezan Bank cheque leaf">
  <defs>
    <pattern id="meezan-geo" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M28 4 L52 28 L28 52 L4 28 Z" fill="none" stroke="#c9dfc4" stroke-width="1"/>
      <path d="M28 16 L40 28 L28 40 L16 28 Z" fill="none" stroke="#d7e8d2" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="1905" height="889" fill="#f4f8f1"/>
  <rect width="1905" height="889" fill="url(#meezan-geo)"/>
  <rect x="8" y="8" width="1889" height="873" fill="none" stroke="#8eae92" stroke-width="2"/>

  <text x="36" y="72" fill="#0b6a3a" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700">Meezan Bank</text>
  <text x="38" y="102" fill="#1d7a48" font-family="Georgia, 'Times New Roman', serif" font-size="18">The Premier Islamic Bank</text>
  <rect x="38" y="118" width="168" height="28" rx="3" fill="#0b6a3a"/>
  <text x="58" y="138" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">PREMIUM</text>

  <text x="250" y="138" fill="#1a3328" font-family="Arial, Helvetica, sans-serif" font-size="18">Branch</text>
  <line x1="320" y1="142" x2="980" y2="142" stroke="#1a3328" stroke-width="1.4"/>

  <text x="1347" y="58" fill="#1a3328" font-family="Arial, Helvetica, sans-serif" font-size="16">Cheque No.</text>
  <line x1="1488" y1="62" x2="1860" y2="62" stroke="#1a3328" stroke-width="1.3"/>
  <text x="1275" y="166" fill="#1a3328" font-family="Arial, Helvetica, sans-serif" font-size="16">Date</text>

  <!-- Eight DDMMYYYY boxes: left 135.2 mm, top 17.7 mm, pitch 6.41 mm, height 8.3 mm -->
  <g fill="none" stroke="#1a3328" stroke-width="1.3">
    <rect x="1352" y="177" width="64.1" height="83"/>
    <rect x="1416.1" y="177" width="64.1" height="83"/>
    <rect x="1480.2" y="177" width="64.1" height="83"/>
    <rect x="1544.3" y="177" width="64.1" height="83"/>
    <rect x="1608.4" y="177" width="64.1" height="83"/>
    <rect x="1672.5" y="177" width="64.1" height="83"/>
    <rect x="1736.6" y="177" width="64.1" height="83"/>
    <rect x="1800.7" y="177" width="64.1" height="83"/>
  </g>
  <g fill="#5d7a68" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle">
    <text x="1384" y="168">D</text>
    <text x="1448" y="168">D</text>
    <text x="1512" y="168">M</text>
    <text x="1576" y="168">M</text>
    <text x="1640" y="168">Y</text>
    <text x="1705" y="168">Y</text>
    <text x="1769" y="168">Y</text>
    <text x="1833" y="168">Y</text>
  </g>

  <!-- Pay line at 41.2 mm. "Pay" is left of the line; "or bearer" sits before the PKR box. -->
  <text x="42" y="406" fill="#1a3328" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Pay</text>
  <line x1="300" y1="412" x2="1220" y2="412" stroke="#1a3328" stroke-width="1.5"/>
  <text x="1236" y="406" fill="#1a3328" font-family="Arial, Helvetica, sans-serif" font-size="18">or bearer</text>

  <!-- PKR box: left 134.3 mm, top 38.7 mm, 52.6 by 7.5 mm. PKR occupies the left inset. -->
  <rect x="1343" y="387" width="526" height="75" fill="#ffffff" stroke="#1a3328" stroke-width="1.6"/>
  <text x="1362" y="436" fill="#1a3328" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">PKR</text>

  <!-- Rupees lines at 47.6 mm and 55.2 mm -->
  <text x="28" y="470" fill="#1a3328" font-family="Arial, Helvetica, sans-serif" font-size="20">Rupees</text>
  <line x1="320" y1="476" x2="1200" y2="476" stroke="#1a3328" stroke-width="1.5"/>
  <line x1="40" y1="552" x2="1200" y2="552" stroke="#1a3328" stroke-width="1.5"/>

  <text x="40" y="690" fill="#1a3328" font-family="Arial, Helvetica, sans-serif" font-size="16">A/C No.</text>
  <line x1="130" y1="694" x2="620" y2="694" stroke="#1a3328" stroke-width="1.3"/>

  <line x1="1340" y1="650" x2="1865" y2="650" stroke="#1a3328" stroke-width="1.4"/>
  <text x="1468" y="678" fill="#3d5c4a" font-family="Arial, Helvetica, sans-serif" font-size="15">Authorised Signature</text>

  <line x1="40" y1="742" x2="1865" y2="742" stroke="#8eae92" stroke-width="1"/>
  <text x="952" y="732" fill="#6a8574" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">Please do not write below this line</text>
  <rect x="8" y="760" width="1889" height="121" fill="#f7f4ea"/>
</svg>
